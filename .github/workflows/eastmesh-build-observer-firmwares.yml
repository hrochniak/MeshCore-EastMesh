name: EastMesh Build Observer Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OFFICIAL_MESHCORE_VERSION: ${{ vars.OFFICIAL_MESHCORE_VERSION }}
      PLATFORMIO_BUILD_FLAGS: -UMQTT_DEBUG
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        run: /usr/bin/env bash eastmesh-build.sh build-firmware Xiao_S3_WIO_repeater_observer LilyGo_TLora_V2_1_1_6_repeater_observer_no_web

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: observer-firmwares
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Observer EastMesh Firmware ${{ github.ref_name }}
          body: "Release generated automatically from tag ${{ github.ref_name }}."
          draft: false
          files: out/*
