name: EastMesh Build Companion WiFi Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "companion-wifi-v*"

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      OFFICIAL_MESHCORE_VERSION: ${{ vars.OFFICIAL_MESHCORE_VERSION }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        run: /usr/bin/env bash eastmesh-build.sh build-firmware Xiao_S3_WIO_companion_radio_wifi LilyGo_TLora_V2_1_1_6_companion_radio_wifi

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: companion-wifi-firmwares
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Companion WiFi Firmware ${{ github.ref_name }}
          body: "Release generated automatically from tag ${{ github.ref_name }}."
          draft: false
          files: out/*
